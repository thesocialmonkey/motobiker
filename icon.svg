<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="50%" stop-color="#161923" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="220" r="165" fill="none" stroke="#262c3a" stroke-width="8" stroke-dasharray="14 10" />
  <circle cx="256" cy="220" r="150" fill="#131720" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Motorbike Graphic Silhouette / Wings -->
  <!-- Left Wing -->
  <path d="M 130 190 Q 180 170 240 195 L 230 215 Q 180 195 140 210 Z" fill="url(#goldGrad)" />
  <path d="M 120 215 Q 170 200 230 220 L 225 235 Q 175 220 135 235 Z" fill="url(#goldGrad)" opacity="0.8" />
  
  <!-- Right Wing -->
  <path d="M 382 190 Q 332 170 272 195 L 282 215 Q 332 195 372 210 Z" fill="url(#goldGrad)" />
  <path d="M 392 215 Q 342 200 282 220 L 287 235 Q 337 220 377 235 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Biker Helmet / Motorcycle Front Center -->
  <path d="M 256 120 C 215 120 190 150 190 195 C 190 240 215 275 256 295 C 297 275 322 240 322 195 C 322 150 297 120 256 120 Z" fill="#1e2433" stroke="url(#goldGrad)" stroke-width="5" />
  
  <!-- Visor -->
  <path d="M 205 185 Q 256 170 307 185 C 307 215 285 240 256 240 C 227 240 205 215 205 185 Z" fill="#0b0e14" stroke="#f59e0b" stroke-width="3" />
  <path d="M 220 195 Q 256 185 292 195 Q 275 225 256 225 Q 237 225 220 195 Z" fill="url(#goldGrad)" opacity="0.4" />

  <!-- Front Wheel / Fork Lines -->
  <path d="M 235 270 L 225 320 L 245 320 L 250 285 Z" fill="#64748b" />
  <path d="M 277 270 L 287 320 L 267 320 L 262 285 Z" fill="#64748b" />
  <circle cx="256" cy="330" r="28" fill="#090a0f" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="330" r="10" fill="#f59e0b" />

  <!-- Stars -->
  <polygon points="256,70 262,85 278,85 265,95 270,110 256,100 242,110 247,95 234,85 250,85" fill="#f59e0b" />
  <polygon points="190,88 194,100 207,100 196,108 200,120 190,112 180,120 184,108 173,100 186,100" fill="#f59e0b" transform="scale(0.8) translate(40,20)" />
  <polygon points="322,88 326,100 339,100 328,108 332,120 322,112 312,120 316,108 305,100 318,100" fill="#f59e0b" transform="scale(0.8) translate(70,20)" />

  <!-- Text Badge -->
  <rect x="56" y="385" width="400" height="52" rx="16" fill="#131722" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="418" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="21" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">MOTO TEAM BIKER</text>
  
  <text x="256" y="465" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">BARINAS</text>
  <text x="256" y="490" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">1ER ANIVERSARIO</text>
</svg>
